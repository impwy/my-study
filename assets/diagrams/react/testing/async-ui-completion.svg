<svg xmlns="http://www.w3.org/2000/svg" width="960" height="365" viewBox="0 0 960 365" role="img" aria-labelledby="title desc">
  <title id="title">비동기 UI 테스트의 완료 경계</title>
  <desc id="desc">저장 요청 도착 뒤에도 응답 처리, 화면 이동, 목록 조회가 이어진다. 요청 도착만 기다리면 남은 작업이 다음 테스트와 겹칠 수 있다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs>
  <rect width="960" height="365" rx="14" fill="#fff"/>
  <g font-family="system-ui, -apple-system, Apple SD Gothic Neo, sans-serif" fill="#0f172a">
    <text x="32" y="44" font-size="26" font-weight="600">요청 도착과 사용자 흐름 완료는 다른 시점</text>
    <text x="32" y="77" font-size="17" fill="#475569">저장 후 새 목록으로 이동하는 앱의 예시 · 왼쪽에서 오른쪽으로 진행</text>
    <g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"><path d="M230 167 H263"/><path d="M458 167 H491"/><path d="M686 167 H719"/></g>
    <g stroke-width="1.6">
      <rect x="32" y="124" width="198" height="86" rx="10" fill="#fffbeb" stroke="#b45309"/>
      <rect x="264" y="124" width="194" height="86" rx="10" fill="#eff6ff" stroke="#2563eb"/>
      <rect x="492" y="124" width="194" height="86" rx="10" fill="#eff6ff" stroke="#2563eb"/>
      <rect x="720" y="124" width="208" height="86" rx="10" fill="#f0fdf4" stroke="#15803d"/>
    </g>
    <g font-size="19" text-anchor="middle"><text x="131" y="160">저장 요청 도착</text><text x="131" y="188">MSW 핸들러 호출</text><text x="361" y="160">저장 응답</text><text x="361" y="188">성공 처리</text><text x="589" y="160">화면 이동</text><text x="589" y="188">후속 목록 조회</text><text x="824" y="160">새 목록 결과 표시</text><text x="824" y="188">계약한 화면 확인</text></g>
    <path d="M131 218 V255 H589" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="132" y="287" font-size="18" fill="#b91c1c">여기서 테스트 종료 → 남은 작업이 다음 테스트와 겹칠 수 있음</text>
    <path d="M824 218 V264" fill="none" stroke="#15803d" stroke-width="2"/>
    <text x="824" y="289" font-size="18" text-anchor="middle" fill="#15803d">완료 조건의 예</text>
    <text x="32" y="337" font-size="17" fill="#475569">조회 수 0은 보조 신호다. 타이머·mutation·별도 요청까지 모두 끝났다는 뜻은 아니다.</text>
  </g>
</svg>
